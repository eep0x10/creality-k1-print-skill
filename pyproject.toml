[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creality-k1-print-skill"
version = "0.3.0"
description = "An agent skill and local PLA workflow for the Creality K1: prepare, preview, approve, print."
readme = "README.en.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "eep0x10"}]
dependencies = ["requests>=2.32,<3", "numpy>=1.24,<3", "trimesh>=4,<6", "matplotlib>=3.8,<4", "Pillow>=10,<14"]
keywords = ["creality", "k1", "3d-printing", "agent-skill", "orcaslicer", "moonraker"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Printing",
]

[project.urls]
Homepage = "https://github.com/eep0x10/creality-k1-print-skill"
Issues = "https://github.com/eep0x10/creality-k1-print-skill/issues"

[project.scripts]
k1print = "k1print.cli:main"

[tool.setuptools]
package-dir = {"" = "skills/creality-k1-print/scripts"}

[tool.setuptools.packages.find]
where = ["skills/creality-k1-print/scripts"]
include = ["k1print*"]
